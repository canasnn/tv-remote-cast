name: Android CI

on:
  push:
    branches: [ main, receiver ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew


      - name: Compile and Build Debug APK
        run: ./gradlew :app:assembleDebug :receiver:assembleDebug --no-daemon

      - name: Run Unit Tests
        run: ./gradlew :castcore:test :protocol:test --no-daemon
